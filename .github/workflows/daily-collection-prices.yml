# Re-prices every card held in a collection (variant-aware) once per day so
# portfolio values never drift from the market. Requires APP_URL and
# CRON_SECRET in repository Actions secrets.

name: Collection Price Refresh

on:
  schedule:
    - cron: "40 7 * * *" # 07:40 UTC, after the overnight TCGplayer update
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh collection prices
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/scheduled/binder-prices" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 600
